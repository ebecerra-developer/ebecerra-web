<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  /* Post curiosidad "el @ del email" · 1080×1350 · formato ¿Sabías que?
     Hero: la @ gigante + un email de ejemplo. Ray Tomlinson, 1971. Solo Inter, acento por color. */
  :root{--green:#047857;--green-light:#6EE7B7;--cream:#FAF6EE;--ink:#0e2a1f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;padding:88px 84px;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 30% 14%,#058a63 0%,#047857 52%,#02583c 100%)}

  .kick{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:rgba(3,40,26,.4);
    border:1px solid rgba(110,231,183,.3);color:var(--green-light);font-size:26px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;padding:12px 26px;border-radius:999px;margin-bottom:30px}
  .h1{font-size:66px;font-weight:900;line-height:1.05;letter-spacing:-.035em;color:var(--cream)}
  .h1 .hr{color:var(--green-light)}

  /* Hero: la @ + email */
  .card{margin-top:44px;flex-shrink:0;background:var(--cream);border-radius:30px;padding:44px 46px 48px;box-shadow:0 34px 80px -30px rgba(2,16,10,.85);text-align:center}
  .card .at{font-size:300px;font-weight:800;line-height:.9;color:var(--green);letter-spacing:-.03em}
  .card .field{margin-top:20px;display:inline-flex;align-items:center;background:#fff;border:2px solid #e4ddcd;border-radius:999px;padding:20px 34px;font-size:44px;font-weight:800;color:var(--ink)}
  .card .field b{color:var(--green);font-weight:900;margin:0 2px}
  .card .tag{margin-top:22px;font-size:29px;font-weight:700;color:#6b7c72}
  .card .tag b{color:var(--green)}

  .remate{margin-top:auto;margin-bottom:64px}
  .remate .line{font-size:44px;font-weight:800;line-height:1.18;color:var(--cream)}
  .remate .line em{font-style:normal;color:var(--green-light)}
  .remate .sub{margin-top:16px;font-size:33px;font-weight:600;color:rgba(250,246,238,.72);line-height:1.3}

  .chip{position:absolute;bottom:56px;left:84px;display:flex;align-items:center;gap:13px;font-weight:700;font-size:27px;color:var(--cream)}
  .chip .dot{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
</style>
</head>
<body>
  <div class="stage">
    <div class="kick">✦ ¿Sabías que…?</div>
    <div class="h1">El <span class="hr">@</span> de tu email lo eligió una persona. En serio.</div>

    <div class="card">
      <div class="at">@</div>
      <div class="field">hola<b>@</b>tunegocio.es</div>
      <div class="tag">el mismo signo, en cada email, desde <b>1971</b></div>
    </div>

    <div class="remate">
      <div class="line">Lo puso <em>Ray Tomlinson</em> en el primer email en red.</div>
      <div class="sub">¿Por qué la @? Porque era el único signo del teclado que nadie usaba… y que no aparece en ningún nombre.</div>
    </div>

    <div class="chip"><span class="dot">eB</span>@ebecerra.es</div>
  </div>
</body>
</html>
