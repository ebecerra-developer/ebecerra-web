<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  /* Post valor "tu competencia no es mejor, aparece antes" · 1080×1350 · visibilidad/SEO.
     Guiño visual: barra de búsqueda estilo buscador. Solo Inter, acento por color. */
  :root{--green:#047857;--green-light:#6EE7B7;--cream:#FAF6EE;--ink:#0e2a1f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;padding:92px 84px;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 30% 14%,#058a63 0%,#047857 52%,#02583c 100%)}

  .kick{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:rgba(3,40,26,.4);
    border:1px solid rgba(110,231,183,.3);color:var(--green-light);font-size:26px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;padding:12px 26px;border-radius:999px;margin-bottom:40px}
  .h1{font-size:82px;font-weight:900;line-height:1.04;letter-spacing:-.04em;color:var(--cream)}
  .h1 em{font-style:normal;color:var(--green-light)}

  /* Barra de búsqueda (guiño visual) */
  .search{margin-top:58px;display:flex;align-items:center;gap:22px;background:var(--cream);border-radius:999px;padding:26px 38px;box-shadow:0 30px 70px -30px rgba(2,16,10,.8)}
  .search svg{width:44px;height:44px;flex-shrink:0}
  .search .q{font-size:38px;font-weight:600;color:#5a6660}
  .search .cursor{width:4px;height:44px;background:var(--green);border-radius:2px;margin-left:2px}

  .sub{margin-top:60px;font-size:42px;font-weight:600;color:rgba(250,246,238,.86);line-height:1.32}
  .sub b{font-weight:800;color:var(--cream)}

  .chip{position:absolute;bottom:56px;left:84px;display:flex;align-items:center;gap:13px;font-weight:700;font-size:27px;color:var(--cream)}
  .chip .dot{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
</style>
</head>
<body>
  <div class="stage">
    <div class="kick">✦ Que te encuentren</div>
    <div class="h1">Tu competencia no siempre es mejor.<br>Solo <em>aparece antes</em>.</div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8a968f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="q">lo que haces, cerca de mí</span>
      <span class="cursor"></span>
    </div>

    <div class="sub">Cuando alguien busca lo que ofreces y no te encuentra, <b>llama al siguiente</b>. No por mejor; por estar visible.</div>

    <div class="chip"><span class="dot">eB</span>@ebecerra.es</div>
  </div>
</body>
</html>
