<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  /* Post personal "de una en una" · 1080×1350 · honestidad/diferenciación.
     Fondo crema (cálido, distinto de los posts verdes). Solo Inter, acento por color. */
  :root{--green:#047857;--green-light:#6EE7B7;--cream:#FAF6EE;--ink:#0e2a1f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;padding:96px 88px;display:flex;flex-direction:column;justify-content:center;background:var(--cream)}

  .kick{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:rgba(4,120,87,.1);
    color:var(--green);font-size:26px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 26px;border-radius:999px;margin-bottom:44px}
  .h1{font-size:80px;font-weight:900;line-height:1.06;letter-spacing:-.035em;color:var(--ink)}
  .h1 em{font-style:normal;color:var(--green)}

  .body{margin-top:46px;font-size:44px;font-weight:500;line-height:1.34;color:#3f4a45}
  .body b{font-weight:800;color:var(--ink)}

  .cta{margin-top:64px;font-size:38px;font-weight:700;color:var(--green);line-height:1.3}

  .chip{position:absolute;bottom:56px;left:88px;display:flex;align-items:center;gap:13px;font-weight:700;font-size:27px;color:var(--green)}
  .chip .dot{width:44px;height:44px;border-radius:50%;background:var(--green);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
</style>
</head>
<body>
  <div class="stage">
    <div class="kick">✦ De tú a tú</div>
    <div class="h1">No hago webs en cadena. Las hago <em>de una en una</em>.</div>

    <div class="body">Por eso la tuya no es un número en una cola. Es la que tengo entre manos: recibe tiempo, cabeza y <b>las vueltas que hagan falta</b> hasta que funcione de verdad.</div>

    <div class="cta">¿Te la hago con calma? Escríbeme y hablamos.</div>

    <div class="chip"><span class="dot">eB</span>@ebecerra.es</div>
  </div>
</body>
</html>
