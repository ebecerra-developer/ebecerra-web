<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  /* Post curiosidad "Antes de Google hubo BackRub" · 1080×1350 · formato ¿Sabías que?
     Mockup de dos barras de búsqueda (BackRub 1996 → Google 1997). Solo Inter, acento por color. */
  :root{--green:#047857;--green-light:#6EE7B7;--cream:#FAF6EE;--ink:#0e2a1f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;padding:88px 84px;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 30% 14%,#058a63 0%,#047857 52%,#02583c 100%)}

  .kick{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:rgba(3,40,26,.4);
    border:1px solid rgba(110,231,183,.3);color:var(--green-light);font-size:26px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;padding:12px 26px;border-radius:999px;margin-bottom:30px}
  .h1{font-size:70px;font-weight:900;line-height:1.05;letter-spacing:-.035em;color:var(--cream)}
  .h1 .hr{color:var(--green-light)}

  /* Tarjeta rename */
  .card{margin-top:48px;flex-shrink:0;background:var(--cream);border-radius:30px;padding:44px 46px;box-shadow:0 34px 80px -30px rgba(2,16,10,.85)}
  .row{display:flex;align-items:center;gap:24px}
  .row .yr{width:96px;flex-shrink:0;font-size:30px;font-weight:800;color:#9aa79f}
  .bar{flex:1;display:flex;align-items:center;gap:20px;background:#fff;border:2px solid #e4ddcd;border-radius:999px;padding:22px 30px}
  .bar svg{width:38px;height:38px;flex-shrink:0}
  .bar .w{font-size:48px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
  .bar .w.g{color:var(--green)}
  .card .mid{display:flex;align-items:center;gap:24px;margin:20px 0}
  .card .mid .yr{width:96px;flex-shrink:0}
  .card .mid svg{width:40px;height:40px;stroke:#c3bBa6}

  .remate{margin-top:auto;margin-bottom:64px}
  .remate .line{font-size:46px;font-weight:800;line-height:1.18;color:var(--cream)}
  .remate .line em{font-style:normal;color:var(--green-light)}
  .remate .sub{margin-top:16px;font-size:33px;font-weight:600;color:rgba(250,246,238,.72);line-height:1.3}

  .chip{position:absolute;bottom:56px;left:84px;display:flex;align-items:center;gap:13px;font-weight:700;font-size:27px;color:var(--cream)}
  .chip .dot{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
</style>
</head>
<body>
  <div class="stage">
    <div class="kick">✦ ¿Sabías que…?</div>
    <div class="h1">Antes de ser Google, se llamó <span class="hr">BackRub</span>.</div>

    <div class="card">
      <div class="row">
        <div class="yr">1996</div>
        <div class="bar"><svg viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="w">BackRub</span></div>
      </div>
      <div class="mid"><div class="yr"></div><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
      <div class="row">
        <div class="yr">1997</div>
        <div class="bar"><svg viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="w g">Google</span></div>
      </div>
    </div>

    <div class="remate">
      <div class="line">Menos mal que lo cambiaron.<br>«Búscalo en <em>BackRub</em>» no sonaba igual.</div>
      <div class="sub">Lo crearon Larry Page y Sergey Brin en Stanford. «Google» viene de «googol»: un 1 con 100 ceros.</div>
    </div>

    <div class="chip"><span class="dot">eB</span>@ebecerra.es</div>
  </div>
</body>
</html>
