<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  /* Post humor/relatable NO-web: ser autónomo = hacer de todo ("mil gorros").
     Pilar nº1 interacción. Fondo verde. Solo Inter, acento por color. */
  :root{--green:#047857;--green-light:#6EE7B7;--cream:#FAF6EE;--ink:#0e2a1f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;padding:96px 88px;display:flex;flex-direction:column;justify-content:center;
    background:radial-gradient(120% 80% at 30% 14%,#058a63 0%,#047857 52%,#02583c 100%)}

  .kick{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:rgba(3,40,26,.4);
    border:1px solid rgba(110,231,183,.3);color:var(--green-light);font-size:26px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;padding:12px 26px;border-radius:999px;margin-bottom:44px}
  .h1{font-size:84px;font-weight:900;line-height:1.04;letter-spacing:-.04em;color:var(--cream)}
  .h1 em{font-style:normal;color:var(--green-light)}

  .body{margin-top:46px;font-size:43px;font-weight:500;line-height:1.34;color:rgba(250,246,238,.85)}
  .body b{font-weight:800;color:var(--cream)}

  .cta{margin-top:58px;font-size:38px;font-weight:700;color:var(--green-light);line-height:1.3}

  .chip{position:absolute;bottom:56px;left:88px;display:flex;align-items:center;gap:13px;font-weight:700;font-size:27px;color:var(--cream)}
  .chip .dot{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
</style>
</head>
<body>
  <div class="stage">
    <div class="kick">✦ Nadie te avisa</div>
    <div class="h1">Autónomo: un trabajo y <em>mil gorros</em>.</div>

    <div class="body">En un mismo día eres contable, comercial, informático, el de las redes y atención al cliente. <b>Y, si queda un hueco, haces lo tuyo.</b></div>

    <div class="cta">¿Con qué gorro te peleas más? Cuéntame.</div>

    <div class="chip"><span class="dot">eB</span>@ebecerra.es</div>
  </div>
</body>
</html>
